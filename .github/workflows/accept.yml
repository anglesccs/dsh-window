name: accept

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  accept:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1 -Version 1.3.0

      - name: Behavior acceptance
        shell: powershell
        run: .\ci\accept_behavior_windows.ps1 -Source "${{ github.workspace }}\dist" -ServeLocal

      - name: Generate file icons
        shell: powershell
        run: .\tools\file-icons\generate-icons.ps1 -Force

      - name: File icon acceptance
        shell: powershell
        run: .\ci\accept_file_icons.ps1 -IconDir "${{ github.workspace }}\tools\file-icons" -InstallScript "${{ github.workspace }}\tools\file-icons\install-file-icons.ps1"

      - name: Collect launcher log
        if: always()
        shell: powershell
        run: |
          $destDir = "${{ runner.temp }}\dshw-accept"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $src = Join-Path $env:LOCALAPPDATA "DeepSeekHarnessWindow\launcher.log"
          if (Test-Path -LiteralPath $src) {
            Copy-Item -LiteralPath $src -Destination (Join-Path $destDir "launcher.log") -Force
            Write-Host "Copied $src to $destDir"
          } else {
            Write-Host "launcher.log not found at $src; skipping copy"
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accept-logs
          if-no-files-found: warn
          path: ${{ runner.temp }}\dshw-accept
